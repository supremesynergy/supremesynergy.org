<!--
  MOCK. This is a design study of the one page guide, used so the blurred
  preview on the homepage has something to show. It is NOT the guide.

  Before the site goes live: write the real guide, export page one as PNG at
  roughly 1360x1760, save it as /downloads/guide-preview.png, and point the
  <img> in index.html at it. Showing a blurred picture of a document that does
  not exist is showing the reader nothing.

  The layout below is a usable starting design if you want the guide to match
  the site: dark ground, gold linework, the map at the centre, three steps under it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 880" width="680" height="880" role="img"
     aria-label="Design mock of the one page guide">
  <rect width="680" height="880" fill="#14110d"/>
  <rect x="26" y="26" width="628" height="828" fill="none" stroke="#d4af37" stroke-opacity="0.28" stroke-width="1.5"/>

