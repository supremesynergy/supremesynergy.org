    <text x="340" y="104" font-size="40">The Invisible Map</text>
    <text x="340" y="140" font-size="19" fill="#c0b59c">How to find the rules running your life</text>
    <text x="340" y="166" font-size="19" fill="#c0b59c">and change them</text>
  </g>
  <path d="M290 192h100" stroke="#d4af37" stroke-opacity="0.5" stroke-width="1.5"/>

