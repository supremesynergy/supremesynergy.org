      <g fill="#c0b59c" opacity="0.5">
        <rect x="-78" y="48" width="156" height="6" rx="3"/>
        <rect x="-64" y="64" width="128" height="6" rx="3"/>
        <rect x="-44" y="80" width="88" height="6" rx="3"/>
